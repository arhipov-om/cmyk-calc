<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CMYK Generator - Типография</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Color Preview */
        .color-preview {
            width: 100%;
            aspect-ratio: 1;
            max-height: 40vh;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.1);
            background: #fff;
        }

        /* CMYK Values Display */
        .cmyk-display {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            letter-spacing: 1px;
        }

        /* Color Controls */
        .color-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }

        .color-row.cyan { border-left: 4px solid #00FFFF; }
        .color-row.magenta { border-left: 4px solid #FF00FF; }
        .color-row.yellow { border-left: 4px solid #FFFF00; }
        .color-row.black { border-left: 4px solid #808080; }

        .color-label {
            font-weight: 600;
            font-size: 1.1rem;
            width: 28px;
            text-align: center;
        }

        .color-row.cyan .color-label { color: #00FFFF; }
        .color-row.magenta .color-label { color: #FF00FF; }
        .color-row.yellow .color-label { color: #FFFF00; }
        .color-row.black .color-label { color: #aaa; }

        .btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-minus {
            background: #ff4757;
            color: #fff;
        }

        .btn-plus {
            background: #2ed573;
            color: #fff;
        }

        .value-display {
            flex: 1;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            min-width: 80px;
        }

        /* Reset Button */
        .reset-btn {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn:active {
            background: rgba(255,255,255,0.2);
        }

        /* Prevent zoom on double tap */
        button {
            touch-action: manipulation;
        }

        /* Landscape mode adjustments */
        @media (orientation: landscape) and (max-height: 500px) {
            .color-preview {
                max-height: 25vh;
                aspect-ratio: 2/1;
            }

            .color-controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .color-row {
                padding: 8px;
            }

            .btn {
                width: 48px;
                height: 48px;
                font-size: 1.5rem;
            }
        }

        /* Larger screens */
        @media (min-width: 600px) {
            body {
                padding: 24px;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 24px;
            }

            .color-preview {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CMYK Generator</h1>

        <div class="color-preview" id="colorPreview" style="background-color: rgb(255, 255, 255);"></div>

        <div class="cmyk-display" id="cmykDisplay">C: 0  M: 0  Y: 0  K: 0</div>

        <div class="color-controls">
            <div class="color-row cyan" data-color="c">
                <span class="color-label">C</span>
                <button class="btn btn-minus" type="button">−</button>
                <span class="value-display" id="cValue">0</span>
                <button class="btn btn-plus" type="button">+</button>
            </div>

            <div class="color-row magenta" data-color="m">
                <span class="color-label">M</span>
                <button class="btn btn-minus" type="button">−</button>
                <span class="value-display" id="mValue">0</span>
                <button class="btn btn-plus" type="button">+</button>
            </div>

            <div class="color-row yellow" data-color="y">
                <span class="color-label">Y</span>
                <button class="btn btn-minus" type="button">−</button>
                <span class="value-display" id="yValue">0</span>
                <button class="btn btn-plus" type="button">+</button>
            </div>

            <div class="color-row black" data-color="k">
                <span class="color-label">K</span>
                <button class="btn btn-minus" type="button">−</button>
                <span class="value-display" id="kValue">0</span>
                <button class="btn btn-plus" type="button">+</button>
            </div>
        </div>

        <button class="reset-btn" id="resetBtn" type="button">Сбросить</button>
    </div>

    <script>
        // CMYK values (0-100)
        const cmyk = { c: 0, m: 0, y: 0, k: 0 };

        // CMYK to RGB - exact formula from cmyktool.com (w3color.js)
        function cmykToRgb(c, m, y, k) {
            c = c / 100;
            m = m / 100;
            y = y / 100;
            k = k / 100;

            var r = 255 - ((Math.min(1, c * (1 - k) + k)) * 255);
            var g = 255 - ((Math.min(1, m * (1 - k) + k)) * 255);
            var b = 255 - ((Math.min(1, y * (1 - k) + k)) * 255);

            return { r: Math.round(r), g: Math.round(g), b: Math.round(b) };
        }

        // Update display
        function updateDisplay() {
            // Calculate final color
            const rgb = cmykToRgb(cmyk.c, cmyk.m, cmyk.y, cmyk.k);
            document.getElementById('colorPreview').style.backgroundColor =
                `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

            // Update CMYK display
            document.getElementById('cmykDisplay').textContent =
                `C: ${cmyk.c}  M: ${cmyk.m}  Y: ${cmyk.y}  K: ${cmyk.k}`;

            // Update individual values
            document.getElementById('cValue').textContent = cmyk.c;
            document.getElementById('mValue').textContent = cmyk.m;
            document.getElementById('yValue').textContent = cmyk.y;
            document.getElementById('kValue').textContent = cmyk.k;
        }

        // Adjust color value
        function adjustColor(color, delta) {
            const newValue = cmyk[color] + delta;
            if (newValue >= 0 && newValue <= 100) {
                cmyk[color] = newValue;
                updateDisplay();
            }
        }

        // Reset all colors
        function resetColors() {
            cmyk.c = 0;
            cmyk.m = 0;
            cmyk.y = 0;
            cmyk.k = 0;
            updateDisplay();
        }

        // Setup button handlers
        document.querySelectorAll('.color-row').forEach(row => {
            const color = row.dataset.color;
            const minusBtn = row.querySelector('.btn-minus');
            const plusBtn = row.querySelector('.btn-plus');

            let intervalId = null;
            let timeoutId = null;

            const startAdjust = (delta) => {
                adjustColor(color, delta);
                timeoutId = setTimeout(() => {
                    intervalId = setInterval(() => {
                        adjustColor(color, delta);
                    }, 100);
                }, 400);
            };

            const stopAdjust = () => {
                clearTimeout(timeoutId);
                clearInterval(intervalId);
            };

            // Minus button
            minusBtn.addEventListener('mousedown', () => startAdjust(-1));
            minusBtn.addEventListener('mouseup', stopAdjust);
            minusBtn.addEventListener('mouseleave', stopAdjust);
            minusBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startAdjust(-1);
            });
            minusBtn.addEventListener('touchend', stopAdjust);
            minusBtn.addEventListener('touchcancel', stopAdjust);

            // Plus button
            plusBtn.addEventListener('mousedown', () => startAdjust(1));
            plusBtn.addEventListener('mouseup', stopAdjust);
            plusBtn.addEventListener('mouseleave', stopAdjust);
            plusBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startAdjust(1);
            });
            plusBtn.addEventListener('touchend', stopAdjust);
            plusBtn.addEventListener('touchcancel', stopAdjust);
        });

        // Reset button
        document.getElementById('resetBtn').addEventListener('click', resetColors);

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
