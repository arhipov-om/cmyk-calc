<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CMYK Generator - Типография</title>
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Мобильный CMYK генератор для типографии">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CMYK">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Color Preview - 4 overlapping squares */
        .color-preview-container {
            width: 100%;
            aspect-ratio: 1;
            max-height: 40vh;
            margin: 0 auto 16px;
            position: relative;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.1);
            isolation: isolate;
        }

        .color-square {
            position: absolute;
            width: 62%;
            height: 62%;
            border-radius: 20%;
            mix-blend-mode: multiply;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* C - top left */
        .color-square.cyan {
            top: 5%;
            left: 5%;
            background-color: #fff;
        }

        /* M - top right */
        .color-square.magenta {
            top: 5%;
            right: 5%;
            background-color: #fff;
        }

        /* Y - bottom left */
        .color-square.yellow {
            bottom: 5%;
            left: 5%;
            background-color: #fff;
        }

        /* K - bottom right */
        .color-square.black {
            bottom: 5%;
            right: 5%;
            background-color: #fff;
        }

        /* Labels */
        .color-label-overlay {
            position: absolute;
            font-size: 14px;
            font-weight: 600;
            color: #000;
            z-index: 10;
        }
        .label-c { top: 8px; left: 12px; }
        .label-m { top: 8px; right: 12px; }
        .label-y { bottom: 8px; left: 12px; }
        .label-k { bottom: 8px; right: 12px; }

        /* Center click zone */
        .center-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: 30%;
            cursor: pointer;
            z-index: 20;
            border-radius: 12px;
        }

        /* Fullscreen color overlay */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            isolation: isolate;
            cursor: pointer;
        }

        .fullscreen-overlay.visible {
            display: flex;
        }

        .fullscreen-color-layers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .fullscreen-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: multiply;
        }

        .fullscreen-info {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 24px;
            background: rgba(0,0,0,0.7);
            border-radius: 16px;
            color: #fff;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .fullscreen-info h2 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .fullscreen-info .info-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .fullscreen-info .info-label {
            opacity: 0.7;
        }

        .fullscreen-info .info-value {
            font-weight: 700;
        }

        .fullscreen-info .correction {
            color: #2ed573;
        }

        .fullscreen-info .correction.negative {
            color: #ff4757;
        }

        .fullscreen-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,0,0,0.5);
            font-size: 0.9rem;
            z-index: 10;
        }

        /* CMYK Values Display */
        .cmyk-display {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            letter-spacing: 1px;
        }

        /* Color Controls */
        .color-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }

        .color-row.cyan-row { border-left: 4px solid #00FFFF; }
        .color-row.magenta-row { border-left: 4px solid #FF00FF; }
        .color-row.yellow-row { border-left: 4px solid #FFFF00; }
        .color-row.black-row { border-left: 4px solid #808080; }

        .color-label {
            font-weight: 600;
            font-size: 1.1rem;
            width: 28px;
            text-align: center;
        }

        .color-row.cyan-row .color-label { color: #00FFFF; }
        .color-row.magenta-row .color-label { color: #FF00FF; }
        .color-row.yellow-row .color-label { color: #FFFF00; }
        .color-row.black-row .color-label { color: #aaa; }

        .btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-minus {
            background: #ff4757;
            color: #fff;
        }

        .btn-plus {
            background: #2ed573;
            color: #fff;
        }

        .value-display {
            width: 80px;
            height: 56px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            -moz-appearance: textfield;
            flex-shrink: 0;
        }

        .value-display::-webkit-outer-spin-button,
        .value-display::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .value-display:focus {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        /* Scroll value display */
        .scroll-value {
            width: 80px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            color: #fff;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: ew-resize;
            user-select: none;
            touch-action: none;
            position: relative;
            overflow: hidden;
        }

        .scroll-value::before,
        .scroll-value::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            opacity: 0.4;
        }

        .scroll-value::before {
            left: 6px;
            border-right: 6px solid #fff;
        }

        .scroll-value::after {
            right: 6px;
            border-left: 6px solid #fff;
        }

        .scroll-value:active {
            background: rgba(255,255,255,0.2);
        }

        .scroll-value.hidden,
        .value-display.hidden {
            display: none;
        }

        .delta-display {
            width: 50px;
            flex-shrink: 0;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            text-align: center;
        }

        .delta-positive {
            color: #2ed573;
        }

        .delta-negative {
            color: #ff4757;
        }

        .delta-zero {
            color: rgba(255,255,255,0.3);
        }

        /* Buttons row */
        .buttons-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 16px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .action-btn:active {
            background: rgba(255,255,255,0.2);
        }

        .save-btn {
            border-color: #2ed573;
        }

        .mode-btn {
            border-color: #ffa502;
        }

        .mode-btn.active {
            background: rgba(255,165,2,0.3);
        }

        .base-display {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin-top: 12px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
        }

        /* Prevent zoom on double tap */
        button {
            touch-action: manipulation;
        }

        /* Landscape mode adjustments */
        @media (orientation: landscape) and (max-height: 500px) {
            .color-preview-container {
                max-height: 30vh;
            }

            .color-controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .color-row {
                padding: 8px;
            }

            .btn {
                width: 48px;
                height: 48px;
                font-size: 1.5rem;
            }
        }

        /* Larger screens */
        @media (min-width: 600px) {
            body {
                padding: 24px;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 24px;
            }

            .color-preview-container {
                max-height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CMYK Generator</h1>

        <div class="color-preview-container">
            <div class="color-square cyan" id="squareC"></div>
            <div class="color-square magenta" id="squareM"></div>
            <div class="color-square yellow" id="squareY"></div>
            <div class="color-square black" id="squareK"></div>
            <span class="color-label-overlay label-c">C</span>
            <span class="color-label-overlay label-m">M</span>
            <span class="color-label-overlay label-y">Y</span>
            <span class="color-label-overlay label-k">K</span>
            <div class="center-zone" id="centerZone"></div>
        </div>

        <!-- Fullscreen color overlay -->
        <div class="fullscreen-overlay" id="fullscreenOverlay">
            <div class="fullscreen-color-layers">
                <div class="fullscreen-layer" id="fsLayerC"></div>
                <div class="fullscreen-layer" id="fsLayerM"></div>
                <div class="fullscreen-layer" id="fsLayerY"></div>
                <div class="fullscreen-layer" id="fsLayerK"></div>
            </div>
            <div class="fullscreen-info" id="fullscreenInfo">
                <h2>Цвет</h2>
                <div class="info-row">
                    <span class="info-label">База:</span>
                    <span class="info-value" id="fsBase">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Текущий:</span>
                    <span class="info-value" id="fsCurrent">C0 M0 Y0 K0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Коррекция:</span>
                    <span class="info-value correction" id="fsCorrection">—</span>
                </div>
            </div>
            <span class="fullscreen-hint">Нажмите для закрытия</span>
        </div>

        <div class="cmyk-display" id="cmykDisplay">C: 0  M: 0  Y: 0  K: 0</div>

        <div class="color-controls">
            <div class="color-row cyan-row" data-color="c">
                <span class="color-label">C</span>
                <button class="btn btn-minus" type="button">−</button>
                <input type="number" class="value-display" id="cValue" min="0" max="100" value="0">
                <div class="scroll-value hidden" id="cScroll">0</div>
                <span class="delta-display delta-zero" id="cDelta"></span>
                <button class="btn btn-plus" type="button">+</button>
            </div>

            <div class="color-row magenta-row" data-color="m">
                <span class="color-label">M</span>
                <button class="btn btn-minus" type="button">−</button>
                <input type="number" class="value-display" id="mValue" min="0" max="100" value="0">
                <div class="scroll-value hidden" id="mScroll">0</div>
                <span class="delta-display delta-zero" id="mDelta"></span>
                <button class="btn btn-plus" type="button">+</button>
            </div>

            <div class="color-row yellow-row" data-color="y">
                <span class="color-label">Y</span>
                <button class="btn btn-minus" type="button">−</button>
                <input type="number" class="value-display" id="yValue" min="0" max="100" value="0">
                <div class="scroll-value hidden" id="yScroll">0</div>
                <span class="delta-display delta-zero" id="yDelta"></span>
                <button class="btn btn-plus" type="button">+</button>
            </div>

            <div class="color-row black-row" data-color="k">
                <span class="color-label">K</span>
                <button class="btn btn-minus" type="button">−</button>
                <input type="number" class="value-display" id="kValue" min="0" max="100" value="0">
                <div class="scroll-value hidden" id="kScroll">0</div>
                <span class="delta-display delta-zero" id="kDelta"></span>
                <button class="btn btn-plus" type="button">+</button>
            </div>
        </div>

        <div class="buttons-row">
            <button class="action-btn save-btn" id="saveBtn" type="button">Сохранить базу</button>
            <button class="action-btn mode-btn" id="modeBtn" type="button">Скролл</button>
            <button class="action-btn" id="resetBtn" type="button">Сбросить</button>
        </div>

        <div class="base-display" id="baseDisplay">База: —</div>
    </div>

    <script>
        // CMYK values (0-100)
        const cmyk = { c: 0, m: 0, y: 0, k: 0 };
        // Base CMYK values (for delta calculation)
        let baseCmyk = null;
        // Input mode: 'input' or 'scroll'
        let inputMode = 'input';

        // Convert CMYK value to layer color (for multiply blend)
        // C -> affects Red, M -> affects Green, Y -> affects Blue, K -> affects all
        function getLayerColor(channel, value) {
            const v = Math.round(255 * (1 - value / 100));
            const hex = v.toString(16).padStart(2, '0');

            switch(channel) {
                case 'c': return `#${hex}ffff`; // Cyan reduces Red
                case 'm': return `#ff${hex}ff`; // Magenta reduces Green
                case 'y': return `#ffff${hex}`; // Yellow reduces Blue
                case 'k': return `#${hex}${hex}${hex}`; // Black reduces all
            }
        }

        // Format delta for display
        function formatDelta(delta) {
            if (delta > 0) return `+${delta}`;
            if (delta < 0) return `${delta}`;
            return '';
        }

        // Get delta class
        function getDeltaClass(delta) {
            if (delta > 0) return 'delta-positive';
            if (delta < 0) return 'delta-negative';
            return 'delta-zero';
        }

        // Update display
        function updateDisplay() {
            // Update each color square
            document.getElementById('squareC').style.backgroundColor = getLayerColor('c', cmyk.c);
            document.getElementById('squareM').style.backgroundColor = getLayerColor('m', cmyk.m);
            document.getElementById('squareY').style.backgroundColor = getLayerColor('y', cmyk.y);
            document.getElementById('squareK').style.backgroundColor = getLayerColor('k', cmyk.k);

            // Update CMYK display
            document.getElementById('cmykDisplay').textContent =
                `C: ${cmyk.c}  M: ${cmyk.m}  Y: ${cmyk.y}  K: ${cmyk.k}`;

            // Update individual values
            document.getElementById('cValue').value = cmyk.c;
            document.getElementById('mValue').value = cmyk.m;
            document.getElementById('yValue').value = cmyk.y;
            document.getElementById('kValue').value = cmyk.k;

            // Update scroll values
            document.getElementById('cScroll').textContent = cmyk.c;
            document.getElementById('mScroll').textContent = cmyk.m;
            document.getElementById('yScroll').textContent = cmyk.y;
            document.getElementById('kScroll').textContent = cmyk.k;

            // Update deltas
            if (baseCmyk) {
                ['c', 'm', 'y', 'k'].forEach(channel => {
                    const delta = cmyk[channel] - baseCmyk[channel];
                    const el = document.getElementById(`${channel}Delta`);
                    el.textContent = formatDelta(delta);
                    el.className = 'delta-display ' + getDeltaClass(delta);
                });
            }
        }

        // Save current values as base
        function saveBase() {
            baseCmyk = { ...cmyk };
            document.getElementById('baseDisplay').textContent =
                `База: C${baseCmyk.c} M${baseCmyk.m} Y${baseCmyk.y} K${baseCmyk.k}`;
            updateDisplay();
        }

        // Handle manual input
        function handleInput(color, inputEl) {
            let value = parseInt(inputEl.value) || 0;
            value = Math.max(0, Math.min(100, value));
            cmyk[color] = value;
            updateDisplay();
        }

        // Adjust color value
        function adjustColor(color, delta) {
            const newValue = cmyk[color] + delta;
            if (newValue >= 0 && newValue <= 100) {
                cmyk[color] = newValue;
                updateDisplay();
            }
        }

        // Reset all colors
        function resetColors() {
            cmyk.c = 0;
            cmyk.m = 0;
            cmyk.y = 0;
            cmyk.k = 0;
            baseCmyk = null;
            document.getElementById('baseDisplay').textContent = 'База: —';
            ['c', 'm', 'y', 'k'].forEach(channel => {
                const el = document.getElementById(`${channel}Delta`);
                el.textContent = '';
                el.className = 'delta-display delta-zero';
            });
            updateDisplay();
        }

        // Setup button and input handlers
        document.querySelectorAll('.color-row').forEach(row => {
            const color = row.dataset.color;
            const minusBtn = row.querySelector('.btn-minus');
            const plusBtn = row.querySelector('.btn-plus');
            const input = row.querySelector('.value-display');

            let intervalId = null;
            let timeoutId = null;

            const startAdjust = (delta) => {
                adjustColor(color, delta);
                timeoutId = setTimeout(() => {
                    intervalId = setInterval(() => {
                        adjustColor(color, delta);
                    }, 100);
                }, 400);
            };

            const stopAdjust = () => {
                clearTimeout(timeoutId);
                clearInterval(intervalId);
            };

            // Minus button
            minusBtn.addEventListener('mousedown', () => startAdjust(-1));
            minusBtn.addEventListener('mouseup', stopAdjust);
            minusBtn.addEventListener('mouseleave', stopAdjust);
            minusBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startAdjust(-1);
            });
            minusBtn.addEventListener('touchend', stopAdjust);
            minusBtn.addEventListener('touchcancel', stopAdjust);

            // Plus button
            plusBtn.addEventListener('mousedown', () => startAdjust(1));
            plusBtn.addEventListener('mouseup', stopAdjust);
            plusBtn.addEventListener('mouseleave', stopAdjust);
            plusBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startAdjust(1);
            });
            plusBtn.addEventListener('touchend', stopAdjust);
            plusBtn.addEventListener('touchcancel', stopAdjust);

            // Input field
            input.addEventListener('input', () => handleInput(color, input));
            input.addEventListener('blur', () => handleInput(color, input));
        });

        // Save base button
        document.getElementById('saveBtn').addEventListener('click', saveBase);

        // Reset button
        document.getElementById('resetBtn').addEventListener('click', resetColors);

        // Mode toggle
        function toggleMode() {
            inputMode = inputMode === 'input' ? 'scroll' : 'input';
            const modeBtn = document.getElementById('modeBtn');

            document.querySelectorAll('.value-display').forEach(el => {
                el.classList.toggle('hidden', inputMode === 'scroll');
            });
            document.querySelectorAll('.scroll-value').forEach(el => {
                el.classList.toggle('hidden', inputMode === 'input');
            });

            modeBtn.textContent = inputMode === 'scroll' ? 'Ввод' : 'Скролл';
            modeBtn.classList.toggle('active', inputMode === 'scroll');
        }

        document.getElementById('modeBtn').addEventListener('click', toggleMode);

        // Scroll/drag handling for scroll-value elements (horizontal)
        document.querySelectorAll('.scroll-value').forEach(scrollEl => {
            const color = scrollEl.closest('.color-row').dataset.color;
            let startX = 0;
            let startValue = 0;
            let isDragging = false;
            let accumulatedDelta = 0;

            const onStart = (x) => {
                isDragging = true;
                startX = x;
                startValue = cmyk[color];
                accumulatedDelta = 0;
            };

            const onMove = (x) => {
                if (!isDragging) return;
                const deltaX = x - startX;
                // 5px = 1 unit change (right = increase, left = decrease)
                const deltaValue = Math.round(deltaX / 5);
                if (deltaValue !== accumulatedDelta) {
                    accumulatedDelta = deltaValue;
                    const newValue = Math.max(0, Math.min(100, startValue + deltaValue));
                    if (cmyk[color] !== newValue) {
                        cmyk[color] = newValue;
                        updateDisplay();
                    }
                }
            };

            const onEnd = () => {
                isDragging = false;
            };

            // Mouse events
            scrollEl.addEventListener('mousedown', (e) => {
                e.preventDefault();
                onStart(e.clientX);
            });

            document.addEventListener('mousemove', (e) => {
                onMove(e.clientX);
            });

            document.addEventListener('mouseup', onEnd);

            // Touch events
            scrollEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                onStart(e.touches[0].clientX);
            });

            scrollEl.addEventListener('touchmove', (e) => {
                e.preventDefault();
                onMove(e.touches[0].clientX);
            });

            scrollEl.addEventListener('touchend', onEnd);
            scrollEl.addEventListener('touchcancel', onEnd);

            // Mouse wheel (keep vertical for convenience)
            scrollEl.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -1 : 1;
                adjustColor(color, delta);
            }, { passive: false });
        });

        // Fullscreen overlay
        const fullscreenOverlay = document.getElementById('fullscreenOverlay');
        const centerZone = document.getElementById('centerZone');

        function showFullscreen() {
            // Update fullscreen layers
            document.getElementById('fsLayerC').style.backgroundColor = getLayerColor('c', cmyk.c);
            document.getElementById('fsLayerM').style.backgroundColor = getLayerColor('m', cmyk.m);
            document.getElementById('fsLayerY').style.backgroundColor = getLayerColor('y', cmyk.y);
            document.getElementById('fsLayerK').style.backgroundColor = getLayerColor('k', cmyk.k);

            // Update info
            document.getElementById('fsCurrent').textContent =
                `C${cmyk.c} M${cmyk.m} Y${cmyk.y} K${cmyk.k}`;

            if (baseCmyk) {
                document.getElementById('fsBase').textContent =
                    `C${baseCmyk.c} M${baseCmyk.m} Y${baseCmyk.y} K${baseCmyk.k}`;

                const corrections = ['c', 'm', 'y', 'k'].map(ch => {
                    const d = cmyk[ch] - baseCmyk[ch];
                    if (d === 0) return '';
                    return `${ch.toUpperCase()}${d > 0 ? '+' : ''}${d}`;
                }).filter(s => s).join(' ');

                const correctionEl = document.getElementById('fsCorrection');
                correctionEl.textContent = corrections || '—';

                const hasNegative = ['c', 'm', 'y', 'k'].some(ch => cmyk[ch] - baseCmyk[ch] < 0);
                const hasPositive = ['c', 'm', 'y', 'k'].some(ch => cmyk[ch] - baseCmyk[ch] > 0);
                correctionEl.classList.toggle('negative', hasNegative && !hasPositive);
            } else {
                document.getElementById('fsBase').textContent = '—';
                document.getElementById('fsCorrection').textContent = '—';
            }

            fullscreenOverlay.classList.add('visible');
        }

        function hideFullscreen() {
            fullscreenOverlay.classList.remove('visible');
        }

        centerZone.addEventListener('click', showFullscreen);
        fullscreenOverlay.addEventListener('click', hideFullscreen);

        // Initialize
        updateDisplay();

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
